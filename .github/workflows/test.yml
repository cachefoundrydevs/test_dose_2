name: test
on:
  push:
    paths:
      - 'rtl/**'
      - 'tb/**'
      - 'dummy_l2/**'
      - 'filelists/**'
      - 'tests.txt'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: lint and simulate
        run: |
          set -u
          mkdir -p build logs
          exec > >(tee logs/console.txt) 2>&1
          RTL=$(grep -v '^[-#]' filelists/rtl.f | sed '/^\s*$/d')
          DL2=$(grep -v '^[-#]' filelists/dummy_l2.f | sed '/^\s*$/d')
          SPW=$(grep -v '^[-#]' filelists/single_port.f | sed '/^\s*$/d')
          INC="-Irtl/include -Irtl/prefetch/stride"
          TBC="tb/common/axi_mem_model.v tb/common/snoop_gen.v"
          status=0
          verilator --version; iverilog -V 2>&1 | head -1
          : > logs/lint.log
          for top in l1d_top l1d_top_axi l1d_top_soc l1d_top_single_port l1d_top_single_port_axi; do
            echo "--- lint top: $top ---" >> logs/lint.log
            verilator --lint-only -Wall -Wno-fatal -Wno-DECLFILENAME -Wno-UNUSEDPARAM $INC --top-module $top $RTL $DL2 $SPW >> logs/lint.log 2>&1
          done
          grep -c '%Warning' logs/lint.log | xargs echo "lint warnings:"
          if grep -q '%Error' logs/lint.log; then grep '%Error' logs/lint.log | head -80; echo "LINT: FAIL"; status=1; else echo "LINT: PASS"; fi
          passed=0; failed=0; skipped=0
          while read -r line; do
            [ -z "$line" ] && continue
            case "$line" in *L1D_V14_COMPAT_TOP*) echo "SKIP $line"; skipped=$((skipped+1)); continue;; esac
            set -- $(echo "$line" | tr -d '"')
            t=$1; shift; defs=""; name=$t
            while [ $# -gt 0 ]; do
              if [ "$1" = "-d" ]; then defs="$defs -D$2"; name="${name}_$(echo "$2" | tr '=' '_')"; shift 2; else shift; fi
            done
            src=tb/tests/$t.v; [ -f "$src" ] || src=tb/tests/$t.sv
            echo "--- $name ---"
            if ! iverilog -g2012 $INC -Itb/common $defs -s $t -o build/$name.vvp $RTL $DL2 $SPW $TBC $src > logs/${name}_compile.log 2>&1; then
              head -60 logs/${name}_compile.log; echo "FAIL $name (compile)"; failed=$((failed+1)); status=1; continue
            fi
            timeout 3000 vvp -n build/$name.vvp > logs/$name.log 2>&1
            tail -12 logs/$name.log
            if grep -q "TEST PASSED" logs/$name.log && ! grep -q "L1D.*ERROR" logs/$name.log; then echo "PASS $name"; passed=$((passed+1)); else echo "FAIL $name"; failed=$((failed+1)); status=1; fi
          done < tests.txt
          echo "=== Summary: $passed passed, $failed failed, $skipped skipped ==="
          grep -E 'RESULT|issued c0' logs/tb_latency.log || true
          echo $status > logs/status.txt
          exit 0
      - name: publish results
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.invalid
          mkdir -p /tmp/res; cp -r logs /tmp/res/; for f in /tmp/res/logs/*.log; do tail -n 400 "$f" > "$f.t" && mv "$f.t" "$f"; done; git rev-parse HEAD > /tmp/res/commit.txt
          git checkout --orphan results; git rm -rq --cached . ; git clean -fdq
          cp -r /tmp/res/* .; git add -A; git commit -qm "results"; git push -f origin results
      - name: verdict
        run: exit $(cat /tmp/res/logs/status.txt)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
